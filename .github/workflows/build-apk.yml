name: Build Flutter APK

on:
  push:
    branches: [main, flutter-app, feature/github-apk-release]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: flutter_app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Gradle Wrapper is complete
        working-directory: flutter_app/android
        run: |
          echo "Checking required Gradle Wrapper files..."
          MISSING=""
          for f in gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties; do
            if [ ! -f "$f" ]; then
              MISSING="$MISSING $f"
            fi
          done
          if [ -n "$MISSING" ]; then
            echo "::error::Missing required Gradle Wrapper files:$MISSING"
            echo "Run 'flutter create --platforms=android .' to regenerate the Android platform."
            exit 1
          fi
          echo "All Gradle Wrapper files present:"
          ls -la gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify Flutter installation
        run: |
          flutter --version
          flutter doctor -v

      - name: Install dependencies
        run: flutter pub get

      - name: Run Flutter analyze
        run: flutter analyze --no-fatal-infos

      - name: Run Flutter tests
        run: flutter test

      - name: Build APK (release)
        run: flutter build apk --release

      - name: Verify APK output exists
        run: |
          APK_PATH="build/app/outputs/flutter-apk/app-release.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "::error::APK not found at expected path: $APK_PATH"
            find build -name "*.apk" 2>/dev/null || true
            exit 1
          fi
          echo "APK found: $(ls -lh $APK_PATH | awk '{print $5, $NF}')"

      - name: Verify APK signature
        run: |
          APK_PATH="build/app/outputs/flutter-apk/app-release.apk"
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name "apksigner" | sort -V | tail -1)
          if [ -n "$APKSIGNER" ]; then
            echo "Using apksigner: $APKSIGNER"
            $APKSIGNER verify --verbose --print-certs "$APK_PATH" && echo "APK signature VALID" || {
              echo "::error::APK signature verification FAILED"
              exit 1
            }
          else
            echo "::warning::apksigner not found, skipping signature verification"
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
          if-no-files-found: error
