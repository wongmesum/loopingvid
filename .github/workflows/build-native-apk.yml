name: Build Native Android APK

on:
  push:
    branches: [main, feature/pro-ui-visualizer, fix/stabilize-pro-ui-visualizer, release/1.1.0-stabilization]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build & Test Native App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Gradle Wrapper is complete
        run: |
          MISSING=""
          for f in gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties; do
            if [ ! -f "$f" ]; then
              MISSING="$MISSING $f"
            fi
          done
          if [ -n "$MISSING" ]; then
            echo "::error::Missing required Gradle Wrapper files:$MISSING"
            exit 1
          fi
          echo "All Gradle Wrapper files present."

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-unit-test-report
          path: app/build/reports/tests/
          retention-days: 7

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Verify APK output exists
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "::error::No debug APK produced"
            find app/build/outputs -name "*.apk" 2>/dev/null || true
            exit 1
          fi
          echo "APK found: $(ls -lh "$APK_PATH" | awk '{print $5, $NF}')"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: native-app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: error
