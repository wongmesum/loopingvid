name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  validate:
    name: Validate Tag Format
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract.outputs.version }}
      tag: ${{ steps.extract.outputs.tag }}
    steps:
      - name: Extract and validate version
        id: extract
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.version }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi

          # Validate vMAJOR.MINOR.PATCH format
          if ! echo "$TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Tag '$TAG' does not match format vMAJOR.MINOR.PATCH"
            exit 1
          fi

          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Validated tag: $TAG (version: ${TAG#v})"

      - name: Check release does not already exist
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::error::Release for tag '$TAG' already exists. Cannot publish duplicate."
            exit 1
          fi

  build:
    name: Build Signed APK
    runs-on: ubuntu-latest
    needs: validate
    defaults:
      run:
        working-directory: flutter_app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify Flutter installation
        run: flutter --version

      # === QUALITY GATES ===

      - name: Install dependencies (locked)
        run: flutter pub get

      - name: Run lint/analyze
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

      # === VALIDATE SECRETS BEFORE SIGNING ===

      - name: Validate signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          MISSING=""
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then MISSING="$MISSING ANDROID_KEYSTORE_BASE64"; fi
          if [ -z "$ANDROID_KEY_ALIAS" ]; then MISSING="$MISSING ANDROID_KEY_ALIAS"; fi
          if [ -z "$ANDROID_KEYSTORE_PASSWORD" ]; then MISSING="$MISSING ANDROID_KEYSTORE_PASSWORD"; fi
          if [ -z "$ANDROID_KEY_PASSWORD" ]; then MISSING="$MISSING ANDROID_KEY_PASSWORD"; fi

          if [ -n "$MISSING" ]; then
            echo "::error::Missing required GitHub Secrets:$MISSING"
            echo "Please configure these secrets in Settings > Secrets > Actions"
            exit 1
          fi
          echo "All 4 signing secrets present"

      # === DECODE KEYSTORE & SIGN ===

      - name: Decode keystore from secret
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release-keystore.jks
          # Validate it's a real keystore file (PKCS12 or JKS magic bytes)
          FILE_TYPE=$(file android/app/release-keystore.jks)
          if echo "$FILE_TYPE" | grep -qiE "java keystore|data"; then
            echo "Keystore decoded and validated"
          else
            echo "::error::Decoded file does not appear to be a valid keystore"
            rm -f android/app/release-keystore.jks
            exit 1
          fi

      - name: Create key.properties
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cat > android/key.properties << EOF
          storeFile=release-keystore.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
          echo "key.properties created"

      # === VALIDATE GRADLE WRAPPER ===

      - name: Validate Gradle Wrapper is complete
        working-directory: flutter_app/android
        run: |
          echo "Checking required Gradle Wrapper files..."
          MISSING=""
          for f in gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties; do
            if [ ! -f "$f" ]; then
              MISSING="$MISSING $f"
            fi
          done
          if [ -n "$MISSING" ]; then
            echo "::error::Missing required Gradle Wrapper files:$MISSING"
            echo "Run 'flutter create --platforms=android .' to regenerate the Android platform."
            exit 1
          fi
          echo "All Gradle Wrapper files present:"
          ls -la gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties

      # === BUILD RELEASE APK ===

      - name: Build release APK
        run: flutter build apk --release

      # === VERIFY APK EXISTS ===

      - name: Verify APK output exists
        run: |
          APK_PATH="build/app/outputs/flutter-apk/app-release.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "::error::APK not found at expected path: $APK_PATH"
            echo "Contents of build/app/outputs/:"
            find build/app/outputs/ -name "*.apk" 2>/dev/null || echo "No APK files found"
            exit 1
          fi
          echo "APK found: $(ls -lh $APK_PATH | awk '{print $5, $NF}')"

      # === VERIFY APK SIGNATURE ===

      - name: Verify APK signature
        run: |
          APK_PATH="build/app/outputs/flutter-apk/app-release.apk"
          # apksigner is in Android SDK build-tools
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name "apksigner" | sort -V | tail -1)
          if [ -n "$APKSIGNER" ]; then
            echo "Using apksigner: $APKSIGNER"
            $APKSIGNER verify --verbose "$APK_PATH" && echo "APK signature VALID" || {
              echo "::error::APK signature verification FAILED"
              exit 1
            }
          else
            echo "::warning::apksigner not found, skipping signature verification"
          fi

      # === RENAME & UPLOAD ===

      - name: Rename APK
        id: rename
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          APK_NAME="loopingvid-${VERSION}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "../${APK_NAME}"
          echo "apk_name=${APK_NAME}" >> "$GITHUB_OUTPUT"
          echo "apk_path=loopingvid-${VERSION}.apk" >> "$GITHUB_OUTPUT"
          echo "Renamed to: ${APK_NAME} ($(ls -lh ../${APK_NAME} | awk '{print $5}'))"

      # === CLEAN UP SECRETS ===

      - name: Clean up signing files
        if: always()
        run: |
          rm -f android/app/release-keystore.jks
          rm -f android/key.properties
          echo "Signing files securely removed"

      # === UPLOAD ARTIFACT ===

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: loopingvid-release
          path: loopingvid-${{ needs.validate.outputs.version }}.apk
          retention-days: 7
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [validate, build]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: loopingvid-release

      - name: Verify downloaded APK
        run: |
          APK_NAME="loopingvid-${{ needs.validate.outputs.version }}.apk"
          if [ ! -f "$APK_NAME" ]; then
            echo "::error::Downloaded APK '$APK_NAME' not found"
            ls -la *.apk 2>/dev/null || echo "No APK files in directory"
            exit 1
          fi
          echo "APK ready for release: $(ls -lh $APK_NAME | awk '{print $5, $NF}')"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          APK_NAME="loopingvid-${VERSION}.apk"

          gh release create "${{ needs.validate.outputs.tag }}" \
            "${APK_NAME}" \
            --title "LoopingVid v${VERSION}" \
            --generate-notes

          echo "Release published: https://github.com/${{ github.repository }}/releases/tag/${{ needs.validate.outputs.tag }}"
