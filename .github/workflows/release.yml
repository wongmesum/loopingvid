name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  validate:
    name: Validate Tag Format
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract.outputs.version }}
    steps:
      - name: Extract and validate version
        id: extract
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.version }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi

          # Validate vMAJOR.MINOR.PATCH format
          if ! echo "$TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Tag '$TAG' does not match format vMAJOR.MINOR.PATCH"
            exit 1
          fi

          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Validated tag: $TAG (version: ${TAG#v})"

      - name: Check release does not already exist
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::error::Release for tag '$TAG' already exists"
            exit 1
          fi

  build:
    name: Build Signed APK
    runs-on: ubuntu-latest
    needs: validate
    outputs:
      apk_name: ${{ steps.rename.outputs.apk_name }}
    defaults:
      run:
        working-directory: flutter_app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run lint/analyze
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release-keystore.jks
          echo "Keystore decoded successfully"

      - name: Create key.properties
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cat > android/key.properties << PROPS
          storeFile=app/release-keystore.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          PROPS
          echo "key.properties created"

      - name: Build release APK
        run: flutter build apk --release

      - name: Rename APK
        id: rename
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          APK_NAME="loopingvid-${VERSION}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "../${APK_NAME}"
          echo "apk_name=${APK_NAME}" >> "$GITHUB_OUTPUT"
          echo "Renamed to: ${APK_NAME}"
          ls -lh "../${APK_NAME}"

      - name: Clean up signing files
        if: always()
        run: |
          rm -f android/app/release-keystore.jks
          rm -f android/key.properties
          echo "Signing files removed"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: loopingvid-release
          path: ${{ needs.validate.outputs.version && format('loopingvid-{0}.apk', needs.validate.outputs.version) || 'flutter_app/build/app/outputs/flutter-apk/app-release.apk' }}
          retention-days: 7
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [validate, build]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: loopingvid-release

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          APK_NAME="loopingvid-${VERSION}.apk"

          gh release create "$GITHUB_REF_NAME" \
            "${APK_NAME}" \
            --title "LoopingVid v${VERSION}" \
            --generate-notes
