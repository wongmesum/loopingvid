name: Build Android App (Kotlin)

# Builds and tests the native Android/Kotlin app in the root project (module :app).
# This is separate from build-apk.yml, which builds the Flutter project under flutter_app/.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Assemble & Test :app
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install both JDK 21 and JDK 17. JDK 17 is listed last so it becomes the active JAVA_HOME
      # used to build the app, while JDK 21 stays discoverable for the Gradle toolchain that runs
      # the unit tests (Robolectric 4.16 requires JDK 21 for Android SDK 36).
      - name: Set up JDKs (21 + 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: |
            21
            17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Validate Gradle wrapper files
        run: |
          echo "Checking required Gradle wrapper files..."
          MISSING=""
          for f in gradlew gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties; do
            if [ ! -f "$f" ]; then MISSING="$MISSING $f"; fi
          done
          if [ -n "$MISSING" ]; then
            echo "::error::Missing Gradle wrapper files:$MISSING"
            exit 1
          fi
          chmod +x gradlew
          echo "Gradle wrapper present."

      - name: Generate a debug keystore (debug build type is signed with it)
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android -keypass android \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests (:app)
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Assemble debug APK (:app)
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: loopingvid-app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: warn
