name: loopingvid
description: >
  A Flutter application for video looping, audio mastering, video composition/editing,
  job history management, and 24/7 RTMP live streaming with infinite seamless repeat.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # File & Storage
  file_picker: ^8.0.0
  path_provider: ^2.1.3
  path: ^1.9.0
  permission_handler: ^11.3.1

  # Media Processing
  ffmpeg_kit_flutter_new: ^4.6.2
  video_player: ^2.9.1
  just_audio: ^0.9.39

  # Database & Persistence
  sqflite: ^2.3.3
  shared_preferences: ^2.2.3

  # State & Utils
  provider: ^6.1.2
  uuid: ^4.4.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
